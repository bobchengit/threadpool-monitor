server:
  port: 18081

spring:
  application:
    name: demo-provider

# 线程池指标契约接口开关（false 时 /api/threadpool/metrics 不暴露）
threadpool:
  reporter:
    enabled: true

demo:
  # 启动时是否开启 burst 模式（也可通过 REST 开关 POST /api/demo/burst/{on|off} 切换）
  burst: false
  # 可选 Basic 鉴权，用于联调监控中心的鉴权配置
  auth:
    enabled: false
    username: demo
    password: demo123
